name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild src/ModernRegedit/ModernRegedit.csproj /m /restore /p:Configuration=${{ matrix.configuration }} /p:Platform=x64

      - name: Registry regression
        if: matrix.configuration == 'Debug'
        run: dotnet run --project tests/ModernRegedit.Regression -c Release
